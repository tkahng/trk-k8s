# ArgoCD Application: Phase 7 Postgres, deployed from git like hello.
# The postgres-credentials secret is NOT here — platform.sh creates it
# from a local file (same discipline as the Cloudflare token).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:tkahng/trk-k8s.git
    targetRevision: main
    path: apps/postgres/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: postgres
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

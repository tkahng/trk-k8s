# Phase 7.5 capstone — NetBox, the real Postgres-backed app.
#
# Chosen over Saleor and Supabase (docs/notes/capstone-scope.md). Supabase
# and Immich both ship PATCHED Postgres images, so neither would exercise
# the CNPG platform 7.4 adopted. NetBox runs on plain Postgres, has clean
# externalDatabase support, and — the deciding reason — it is IPAM/DCIM, so
# the data is this cluster's own VPC, subnets and node addresses. Phase 8's
# premise is rebuild-with-real-data-at-stake, and an inventory of your own
# infrastructure is data you'd be annoyed to lose. A demo shop full of fake
# products is not.
#
# Second use of the Helm-source pattern invented for cnpg-operator: ArgoCD
# renders the upstream chart directly, no vendoring.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: netbox
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.netbox.oss.netboxlabs.com
    chart: netbox
    targetRevision: 8.3.57          # app v4.6.8 — drill 2 phase B: upgrade under load, two pods one schema
    helm:
      valuesObject:
        # --- Postgres: the operator's cluster, not the chart's bundled one
        postgresql:
          enabled: false            # disables the vendored Bitnami subchart
        externalDatabase:
          # Through the POOLER, never a pod: the 7.2 indirection that 7.3/7.4
          # proved keeps clients oblivious to failover. Drill 1 tests whether
          # a Django app agrees.
          host: pg-pooler-rw.postgres-cnpg.svc.cluster.local
          port: 5432
          database: netbox
          username: netbox
          existingSecretName: netbox-db
          existingSecretKey: password

        # --- Valkey: keep the chart's bundled one.
        # It's vendored inside the packaged .tgz, so ArgoCD never contacts
        # Bitnami's paywalled OCI registry (verified by unpacking — the
        # problem that pushed us off their pgbouncer image in 7.2 does not
        # apply here). The chart models tasksDatabase (RQ queue) and
        # cachingDatabase (cache) separately, which hands drill 3 its
        # cache-vs-queue contrast pre-separated.
        valkey:
          enabled: true
          # STANDALONE, not the chart default. The default is a primary plus
          # THREE replicas — four Redis pods for a lab cache, on three 4 GiB
          # nodes that already run the platform stack and two CNPG
          # instances. Replication buys nothing here: drill 3 is about what
          # breaks when the cache/queue dies, and one pod makes that
          # cleaner to observe, not harder.
          architecture: standalone
          # PINNED password — the last chart-generated secret, and it bit
          # exactly as the lookup trap predicts: the 8.3.57 upgrade re-render
          # rotated it mid-rollout, Valkey restarted with the new password,
          # and every RUNNING pod started 500ing on stale cache credentials
          # (drill 2 phase B, 2026-08-19). platform.sh creates the secret
          # from ~/.config/trk-k8s/netbox-valkey-password, same as every
          # other credential here.
          auth:
            existingSecret: netbox-valkey-pinned
            existingSecretPasswordKey: password
          master:
            resources:
              requests: {cpu: 50m, memory: 128Mi}
              limits: {memory: 256Mi}

        # --- Secrets: all supplied, none chart-generated.
        # WHY (a real GitOps-with-Helm trap): the chart generates secret_key
        # and api_token_peppers via Helm's `lookup` to preserve existing
        # values across upgrades. `lookup` returns EMPTY under
        # `helm template`, which is how ArgoCD renders — so left alone the
        # chart would mint a fresh secret_key on every sync, invalidating
        # sessions and producing permanent diff churn. platform.sh creates
        # both secrets from local files instead (the 7.x pattern).
        existingSecret: netbox-config
        superuser:
          existingSecret: netbox-superuser

        # --- Edge: the chart ships native Gateway API support, so no
        # Ingress and no hand-written HTTPRoute. Cashes the Phase 6.5
        # promise — a new app is HTTPRoute + DNS, TLS already handled by
        # the Gateway's wildcard cert.
        ingress:
          enabled: false
        httpRoute:
          enabled: true
          hostnames:
            - netbox.k8s.kahng.dev
          parentRefs:
            - name: main
              namespace: gateway
              sectionName: https
        allowedHosts:
          - netbox.k8s.kahng.dev

        # --- Sizing: the first time this project sets requests/limits
        # seriously. Three 4 GiB nodes already run the platform stack at
        # ~40%, plus two CNPG instances.
        # Worth knowing this exists: the entrypoint's "Waiting on DB /
        # Waited 30s or more" message MASKS real config errors. Two
        # 50-character minimums (SECRET_KEY and each API token pepper) both
        # surfaced as a fake database timeout. Set dbWaitDebug: true to get
        # the actual traceback instead of chasing the database.
        # 3 for drill 2 (migrations with many pods sharing one schema); was 1.
        # 2, not 3: drill 2's real capacity finding. The chart mounts a
        # SHARED media volume on every web pod (persistence below), and on
        # RWO local-path that pins all replicas to one node — so honest
        # 1536Mi requests never got to spread anything, two boot spikes
        # colocated, and worker-1 died the same death three times. Media
        # persistence off (we store no uploads; all NetBox data that matters
        # is in Postgres) + hard anti-affinity = exactly one web pod per
        # 4Gi worker. Two workers, two replicas — the honest number.
        replicaCount: 2   # drill 2: one per 8Gi worker, anti-affinity enforced
        # maxSurge 0: hard anti-affinity + surge is self-deadlocking when
        # replicas == nodes — the surge pod needs a node that cannot exist,
        # and the rollout wedges with old pods squatting both workers
        # (phase B, 2026-08-19). Roll DOWN first instead: brief single-pod
        # window per step, but the rollout always completes.
        updateStrategy:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 0
            maxUnavailable: 1
        persistence:
          enabled: false
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: netbox
                    app.kubernetes.io/component: netbox
        # 2Gi, raised from 1Gi: on the Azure bring-up (2026-08-18) the web
        # pod OOM-killed 26 times in a row ~48s after each start — four
        # gunicorn workers warming caches simultaneously spike past 1Gi
        # before settling near 250Mi idle. Same ceiling the AWS era hit when
        # exec'd debug shells shared the cgroup (see the 08-07 journal):
        # kubectl exec runs INSIDE this limit, so headroom serves both boot
        # and debugging. Nodes have 4Gi; the worker Deployment stays at 512Mi.
        # requests raised 512Mi -> 1536Mi in drill 2: the request is a PROMISE
        # TO THE SCHEDULER, and it was a lie. Boot spikes past 1.5Gi; with
        # requests at 512Mi the scheduler packed two booting pods onto one
        # 4Gi worker, which thrashed until its kubelet went silent and the
        # taint manager evicted everything (worker-1, 08:57 UTC). Request
        # what boot actually uses and the scheduler spreads honestly.
        resources:
          requests: {cpu: 200m, memory: 1536Mi}
          limits: {memory: 2Gi}
        worker:
          enabled: true             # the RQ worker — a separate Deployment
          replicaCount: 1
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
  destination:
    server: https://kubernetes.default.svc
    namespace: netbox
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      # The netbox database and role are reconciled by CNPG from the
      # postgres-cnpg app; this one converges once they exist.
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m

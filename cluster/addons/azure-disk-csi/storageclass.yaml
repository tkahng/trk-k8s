# AZURE-ONLY addon (ADR 002: optional per-environment; local-path stays the
# default StorageClass — cloud storage is opt-in via storageClassName).
# Counterpart to cluster/addons/aws-ebs-csi/storageclass.yaml.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: managed-csi
provisioner: disk.csi.azure.com
volumeBindingMode: WaitForFirstConsumer   # bind where the pod schedules (zone-aware)
parameters:
  # StandardSSD, not Premium: a Premium P6 is ~$10/mo each, and the whole
  # point of this class is demonstrating volumes that FOLLOW the pod, not
  # performance (ADR 009's cost note).
  skuName: StandardSSD_LRS
# reclaimPolicy defaults to Delete: PVC deletion deletes the managed disk.

# Let's Encrypt via DNS-01 on Cloudflare. DNS-01 means: to prove domain
# ownership, cert-manager writes a TXT record at _acme-challenge.<host> —
# no inbound connectivity needed, so the firewall stays locked down and
# port 80 never opens. The Cloudflare token lives ONLY in the
# cloudflare-api-token secret (cert-manager namespace), never in git.
#
# Staging first when experimenting: prod has rate limits (5 failed
# validations/hour lock you out); staging is unlimited but browsers don't
# trust its certs.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: tkahng@gmail.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: tkahng@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token

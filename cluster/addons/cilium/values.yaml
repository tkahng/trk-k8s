# Cilium values — see docs/runbooks/03-cilium.md
#
# The one setting that is NOT optional: pod CIDR. Cilium's cluster-pool
# default (10.0.0.0/8) contains our node network (10.0.0.0/16 on AWS and
# Hetzner alike) — pods would collide with machines. Use the range kubeadm
# was init'ed with (--pod-network-cidr=10.244.0.0/16).
ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4PodCIDRList:
      - 10.244.0.0/16

# One replica is enough for a 3-node learning cluster (default is 2).
operator:
  replicas: 1

# Hubble: the observability layer — flow visibility (relay) + web UI.
hubble:
  relay:
    enabled: true
  ui:
    enabled: true

# Phase 6.5: Cilium replaces kube-proxy entirely (eBPF service translation
# instead of iptables) — required by Cilium's Gateway API support, and the
# "planned later lab" finally done. Two things travel with this flag:
#   - kubeadm init must skip the kube-proxy addon (bootstrap.sh does)
#   - Cilium can no longer bootstrap its API server connection through the
#     in-cluster Service VIP (that VIP *was* kube-proxy's job), so
#     bootstrap.sh passes --set k8sServiceHost=<cp private IP> from the
#     inventory. Kept out of this file: provider-specific, not portable.
kubeProxyReplacement: true

# Phase 6.5: Cilium is the Gateway API implementation (ingress-nginx retired
# upstream 2026-03 — docs/notes/reverse-proxies.md). Uses the cilium-envoy
# DaemonSet already on every node. Requires kubeProxyReplacement=true and
# the Gateway API CRDs pre-installed (bootstrap.sh, before this chart).
#
# hostNetwork: Envoy binds listener ports directly on every node instead of
# Cilium creating a LoadBalancer Service. This is the portable successor to
# ADR 003's fixed NodePorts — no cloud LB, no MetalLB, works identically
# on-prem. Listener ports must be >1023; ours (30080/30443) are.
gatewayAPI:
  enabled: true
  hostNetwork:
    enabled: true

# Deliberately NOT set: routing mode (default vxlan tunnel works on any
# provider — portable choice).

# ingress-nginx — the portable way (ADR 003: no cloud LB).
# NodePort with FIXED ports so the firewall rule (30080/30443 in
# infra/aws) and any external DNS/LB can rely on them. On-prem this exact
# config works behind MetalLB or a hardware LB; on AWS-with-CCM it would
# become type: LoadBalancer. The Ingress resources don't change either way.
controller:
  service:
    type: NodePort
    nodePorts:
      http: 30080
      https: 30443
  # Watch all Ingress resources with ingressClassName: nginx (the default
  # class, so Ingresses don't need to say it explicitly).
  ingressClassResource:
    default: true

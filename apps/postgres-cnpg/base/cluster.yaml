# Phase 7.4 — the same database we built by hand in 7.1-7.3, declared in
# one CRD. Every field maps to something we bled for; the absent fields
# map to things the operator absorbs. The 7.3 rubric, annotated:
#
#   trap 1 (scope-name collision)  → operator names/owns pg-rw, pg-ro,
#                                    pg-r Services; no DIY selector-less
#                                    Service, no convention to violate
#   trap 2 (OrderedReady deadlock) → NO StatefulSet at all: CNPG manages
#                                    pods directly, its controller owns
#                                    bootstrap ordering
#   trap 3 (invisible scope label) → operator stamps every label its own
#                                    watches need
#   trap 4 (newline in secret)     → credentials GENERATED by the
#                                    operator (basic-auth Secrets pg-app /
#                                    pg-superuser); no hand-carried bytes
#   config drift (file vs DCS)     → this CRD is the single source; the
#                                    operator reconciles live config from
#                                    it continuously
#
# Deliberately NOT Patroni: CNPG runs its own instance manager against
# the k8s API (leases + status subresources). The apiserver-fence drill
# gets re-run against it — same coupling, different machinery.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg
spec:
  instances: 2
  # Same major+minor and Debian base as our hand-built image
  # (postgres:18 / trixie) — keeps the comparison honest.
  #
  # SYSTEM, not standard: CNPG splits its images by what they carry.
  # `standard` dropped the barman-cloud binaries because backups are
  # migrating to the Barman Cloud Plugin; `system` still ships them, and
  # in-tree spec.backup.barmanObjectStore (below) invokes them directly.
  # Found the hard way: with `standard`, WAL archiving fails with
  # `"barman-cloud-wal-archive": executable file not found in $PATH` —
  # and Postgres reports archived_count climbing regardless (see the
  # journal; CNPG's no-op archive path lies by omission).
  # The plugin (v0.14.0, pre-1.0) is the future; migration is a noted
  # follow-up, not this lab's lesson.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie
  storage:
    size: 5Gi
    # no storageClass -> default = local-path: same node-pin trade as
    # 7.1, on purpose. The operator's replica re-init story meets
    # local storage in the node-loss drill.

  # Roles CNPG reconciles for us. The netbox role owns the netbox database
  # (netbox-database.yaml) and is what the app authenticates as — so NetBox
  # never touches the `app` role or database.
  #
  # passwordSecret must live in THIS namespace; platform.sh writes the same
  # generated password into `netbox` too, because secrets don't cross
  # namespaces.
  managed:
    roles:
      - name: netbox
        ensure: present
        login: true
        passwordSecret:
          name: netbox-db

  # THE capability neither stack had before 7.4. Drill 3 proved etcd
  # snapshots don't cover PV data; 7.1 proved a `destroy` takes the
  # database with it. Ported to Azure Blob during the ADR 009 exile and
  # back to S3 on the return (ADR 010) — same two mechanisms both times:
  #   - WAL archiving: every closed segment ships to object storage. What
  #     makes point-in-time recovery possible at all.
  #   - Base backups: periodic full copies (scheduledbackup.yaml); recovery
  #     = nearest base backup + replay WAL forward.
  # RPO measured on BOTH clouds: the currently-open WAL segment.
  backup:
    retentionPolicy: 7d
    barmanObjectStore:
      # Back on S3 (ADR 010): the bucket in infra/aws-persistent SURVIVED
      # the account suspension — suspended accounts keep their resources.
      # It still holds the pre-suspension base backups, proof the ADR 008
      # boundary held across the harshest lifecycle event yet.
      destinationPath: s3://trk-k8s-pg-backups/
      s3Credentials:
        # Node IAM role over IMDS, no credential Secret (the hop-limit-3
        # path from Phase 4). TRADE-OFF (ADR 007): node-scoped — any pod on
        # the node can reach the bucket; IRSA needs an OIDC provider.
        inheritFromIAMRole: true
      wal:
        compression: gzip
      data:
        compression: gzip

# Phase 7.4 — the same database we built by hand in 7.1-7.3, declared in
# one CRD. Every field maps to something we bled for; the absent fields
# map to things the operator absorbs. The 7.3 rubric, annotated:
#
#   trap 1 (scope-name collision)  → operator names/owns pg-rw, pg-ro,
#                                    pg-r Services; no DIY selector-less
#                                    Service, no convention to violate
#   trap 2 (OrderedReady deadlock) → NO StatefulSet at all: CNPG manages
#                                    pods directly, its controller owns
#                                    bootstrap ordering
#   trap 3 (invisible scope label) → operator stamps every label its own
#                                    watches need
#   trap 4 (newline in secret)     → credentials GENERATED by the
#                                    operator (basic-auth Secrets pg-app /
#                                    pg-superuser); no hand-carried bytes
#   config drift (file vs DCS)     → this CRD is the single source; the
#                                    operator reconciles live config from
#                                    it continuously
#
# Deliberately NOT Patroni: CNPG runs its own instance manager against
# the k8s API (leases + status subresources). The apiserver-fence drill
# gets re-run against it — same coupling, different machinery.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg
spec:
  instances: 2
  # Same major+minor and Debian base as our hand-built image
  # (postgres:18 / trixie) — keeps the comparison honest.
  #
  # SYSTEM, not standard: CNPG splits its images by what they carry.
  # `standard` dropped the barman-cloud binaries; `system` still ships
  # them. Found the hard way in 7.4: with `standard`, WAL archiving failed
  # with `"barman-cloud-wal-archive": executable file not found in $PATH`
  # while Postgres reported archived_count climbing anyway (CNPG's no-op
  # archive path lies by omission).
  #
  # KEPT after the plugin migration (2026-08-27) even though the plugin
  # runs barman in its OWN sidecar image, which in principle frees the
  # postgres image to be `standard`. Not changing two things at once: the
  # image swap is a separate, testable change, and reverting to `standard`
  # while anything still shells out to the in-tree path would resurrect a
  # failure mode that already cost a day.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie
  storage:
    size: 5Gi
    # no storageClass -> default = local-path: same node-pin trade as
    # 7.1, on purpose. The operator's replica re-init story meets
    # local storage in the node-loss drill.

  # DATA SURVIVAL (drill 5, staged 2026-08-27): this generation is BORN from
  # the previous generation's archive instead of empty. Every prior rebuild
  # proved the PLATFORM survives in git while the data only came back because
  # populate.sh rediscovers it from the live cluster — which works for
  # infrastructure records and would be worthless for anything a human typed.
  # No recoveryTarget: recover to the END of available WAL, i.e. everything
  # the dead cluster ever committed (base backup 20260827T194617 + WAL).
  #
  # bootstrap is IMMUTABLE — it only applies when the Cluster is created, so
  # this must be in git BEFORE platform.sh runs on the rebuilt cluster, and
  # it is silently ignored on an existing one. That ordering is exactly what
  # the first drill-5 attempt got wrong.
  #
  # NOTE on roles: the operator mints fresh pg-app/pg-superuser secrets that
  # won't match the restored database's passwords. Harmless here — NetBox
  # authenticates as the `netbox` role, whose password comes from
  # ~/.config/trk-k8s (file-driven secrets, surviving on the laptop) and is
  # reconciled by managed.roles below.
  bootstrap:
    recovery:
      source: pg-previous-generation
  externalClusters:
    - name: pg-previous-generation
      # Plugin form (v0.14.0): one ObjectStore describes the CONTAINER, and
      # serverName picks which generation inside it to read. So the same
      # pg-store serves both roles — write into pg-gen4, recover from
      # pg-gen3 — instead of duplicating credentials per generation.
      # Verified present before wiring: pg-gen3-20260827 holds base backups
      # AND WAL (a generation with WAL but no base backup cannot bootstrap
      # anything). It is the newest data: the drill-5 era, including the
      # three public IPs populate recorded there.
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: pg-store
          serverName: pg-gen3-20260827

  # Roles CNPG reconciles for us. The netbox role owns the netbox database
  # (netbox-database.yaml) and is what the app authenticates as — so NetBox
  # never touches the `app` role or database.
  #
  # passwordSecret must live in THIS namespace; platform.sh writes the same
  # generated password into `netbox` too, because secrets don't cross
  # namespaces.
  managed:
    roles:
      - name: netbox
        ensure: present
        login: true
        passwordSecret:
          name: netbox-db

  # THE capability neither stack had before 7.4. Drill 3 proved etcd
  # snapshots don't cover PV data; 7.1 proved a `destroy` takes the
  # database with it. Two mechanisms, unchanged since:
  #   - WAL archiving: every closed segment ships to object storage. What
  #     makes point-in-time recovery possible at all.
  #   - Base backups: periodic full copies (scheduledbackup.yaml); recovery
  #     = nearest base backup + replay WAL forward.
  # RPO measured on BOTH clouds: the currently-open WAL segment.
  #
  # As of 2026-08-27 this is a PLUGIN, not an in-tree config block: CNPG
  # removes spec.backup.barmanObjectStore in 1.31, so the whole destination
  # moved to objectstore.yaml and only this reference remains. isWALArchiver
  # is what makes the plugin the archive_command's target — without it the
  # plugin can take base backups while WAL archiving silently does nothing,
  # which is the same class of quiet failure as the archived_count lie (7.4)
  # and the empty-archive refusal (08-25).
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: pg-store
        # The write-side generation prefix (runbook 06 step 1b). Bump on
        # every rebuild: a new cluster cannot archive into a dead
        # generation's prefix ("Expected empty archive", 08-25).
        serverName: pg-gen4-20260827

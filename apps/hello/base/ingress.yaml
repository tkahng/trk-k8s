apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello
spec:
  # ingressClassName omitted: ingress-nginx is the cluster default class.
  rules:
  - host: hello.local   # overlays patch in the real host
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: hello
            port:
              number: 80

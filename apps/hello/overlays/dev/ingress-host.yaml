# Env-specific host + TLS live in the overlay (base stays portable).
# *.k8s.kahng.dev is a wildcard A record in Cloudflare (proxy off) pointing
# at the control plane's public IP — changes on rebuild, update it there.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello
  annotations:
    # cert-manager watches Ingresses with this annotation and materializes
    # a Certificate for the tls block below automatically.
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - hello.k8s.kahng.dev
      secretName: hello-tls
  rules:
    - host: hello.k8s.kahng.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hello
                port:
                  number: 80

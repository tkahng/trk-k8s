# Phase 7.3 — the two routing Services Patroni drives. Contrast with
# service.yaml (the headless governing Service, which still exists for
# per-pod DNS): these two answer "who should I talk to", not "who exists".
#
# The leader Service is named `postgres` — the SCOPE, exactly — because
# in use_endpoints mode Patroni writes the leader lease + primary IP to
# the Endpoints named after the scope (source: kubernetes.py leader_path
# strips '-leader'; only -config/-failover/-sync keep suffixes). It has
# NO selector — deliberately: Patroni is the sole author of what's
# behind it, so the election result and the traffic flip are one atomic
# write. pgbouncer points here; apps keep pointing at pgbouncer.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
    cluster-name: postgres
spec:
  ports:
    - port: 5432
      name: postgres
---
# postgres-replica: ordinary label-selector Service, but the role label
# is maintained by PATRONI, not by us — it stamps role=primary|replica
# on pods as elections happen (Patroni 4 naming; 3.x said "master").
# Read-only traffic goes here; empty until a replica exists and healthy
# through failovers because the labels move with the roles.
apiVersion: v1
kind: Service
metadata:
  name: postgres-replica
  labels:
    app: postgres
    cluster-name: postgres
spec:
  selector:
    app: postgres
    role: replica
  ports:
    - port: 5432
      name: postgres
